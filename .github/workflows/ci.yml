name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt,clippy
          rustup default "${{ matrix.toolchain }}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch for tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test,build]'
      - run: python -m pytest -q python
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel import outside source tree
        run: |
          python -m venv /tmp/blut-wheel-test
          /tmp/blut-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/blut-wheel-test/bin/python -c 'import blut_core; print(blut_core.__file__)'
