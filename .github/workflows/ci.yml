# First CI for blut-backends (2026-09-02). Until now this repository had no
# workflow at all: no fmt, no clippy, no tests, no secret scan. Hosted ubuntu
# only -- the LamQuant self-hosted runner is registered to the meta repository
# and serves nothing else.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # `blut` is a private git dependency; cargo's own fetch needs a credential
      # that can read it. SUBMODULE_TOKEN is the fleet's read-only PAT (the same
      # secret name the LamQuant meta uses); github.token is the fallback and
      # cannot read a sibling private repository, so until that secret exists on
      # this repository the clippy/test steps fail at dependency resolution.
      - name: Authenticate cargo git fetches
        env:
          GH_FLEET_TOKEN: ${{ secrets.SUBMODULE_TOKEN || github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_FLEET_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
  secret-scan:
    name: secret-scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
