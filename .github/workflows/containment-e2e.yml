# Stage containment, end to end through BLUT, on real Windows and Linux VMs.
# Each job builds blut-core against a pinned engine commit and checks from
# outside what happens to stage processes:
#
#   windows  trains a tiny CPU model; every stage process must be in a Job
#            Object (attached, capped, peak reported), and a stage timeout and
#            the driver's death must each kill the whole training tree.
#            tests/contained_e2e/windows.py.
#   linux    runs a stub trainer (no model) under the systemd user manager:
#            placement with the memory cap and a peak, the driver's environment
#            reaching the stage, a stage timeout and a SIGTERM to the driver
#            each stopping the whole tree, and the fallbacks without a user bus
#            and with BLUT_NO_CONTAIN=1. tests/contained_e2e/linux.py.
#
# The engine is checked out at BLUT_ENGINE_REV and patched in for crates.io's
# `blut`, because this cookbook pins an engine release that is not published
# yet. Once it is, drop the engine checkout and the patch, and the jobs test
# the published engine instead. Every action is pinned by commit SHA.
name: containment-e2e
on:
  push:
    branches: [main, "agent/**"]
    paths:
      - "src/**"
      - "crates/**"
      - "python/**"
      - "tests/contained_e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/containment-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "python/**"
      - "tests/contained_e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/containment-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  # The engine commit under test (Quitetall/blut).
  BLUT_ENGINE_REV: 44491b7ad87daf884c93987adb74865b59b7d26a
  PYTHONUTF8: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
jobs:
  windows:
    name: train through BLUT in a Job Object (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: cookbooks
    steps:
      # Side by side, not nested: the engine is its own Cargo workspace and
      # must not sit inside this one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cookbooks
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Quitetall/blut
          ref: ${{ env.BLUT_ENGINE_REV }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cookbooks -> target
      - name: Patch crates.io blut with the engine checkout
        shell: bash
        run: |
          engine="$(cygpath -m "$GITHUB_WORKSPACE/engine")"
          mkdir -p .cargo
          printf '[patch.crates-io]\nblut = { path = "%s" }\n' "$engine" > .cargo/config.toml
          cat .cargo/config.toml
      - name: Build blut-core
        run: cargo build -p blut-cookbook-core --bin blut-core
      - name: Install CPU torch and transformers
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers psutil
      - name: Train, time out, and kill the driver, in Job Objects
        shell: bash
        run: >-
          python tests/contained_e2e/windows.py
          --blut target/debug/blut-core.exe
          --work "$RUNNER_TEMP/windows-e2e"
      - name: Keep the run logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-containment-logs
          path: ${{ runner.temp }}/windows-e2e/*.log
          if-no-files-found: warn

  linux:
    name: stub stages through BLUT under systemd (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cookbooks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cookbooks
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Quitetall/blut
          ref: ${{ env.BLUT_ENGINE_REV }}
          path: engine
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cookbooks -> target
      - name: Patch crates.io blut with the engine checkout
        run: |
          mkdir -p .cargo
          printf '[patch.crates-io]\nblut = { path = "%s" }\n' "$GITHUB_WORKSPACE/engine" > .cargo/config.toml
          cat .cargo/config.toml
      - name: Build blut-core
        run: cargo build -p blut-cookbook-core --bin blut-core
      # The runner's user has no systemd user manager until it lingers. Start
      # one and point this job at its bus, as a login session would.
      - name: Start the systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          for _ in $(seq 1 30); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          systemctl --user show-environment > /dev/null
          systemd-run --version | head -1
          echo "delegated controllers: $(cat "/sys/fs/cgroup/user.slice/user-$uid.slice/user@$uid.service/cgroup.controllers")"
      - name: Contain stub stages, time out, SIGTERM the driver, fall back
        run: >-
          python3 tests/contained_e2e/linux.py
          --blut target/debug/blut-core
          --work "$RUNNER_TEMP/linux-e2e"
          --expect systemd
      - name: Keep the run logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-containment-logs
          path: ${{ runner.temp }}/linux-e2e/*.log
          if-no-files-found: warn
