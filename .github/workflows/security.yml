name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
