# blut-backends — the generic-LLM cookbook layer extracted from the BLUT
# engine at the engine-only v1.0 carve. Holds the concrete generic-LLM
# stages (materialize / filter / split / sft·dpo·distill train / merge_lora
# / convert_gguf / register_model / eval_*) + the two concrete training
# backends (HfTrainerBackend, LamuTrainerBackend) with their subprocess
# runners, venv management, and backend-specific stages. Depends on the
# `blut` framework crate (the engine: Stage / Plan / Recipe / Registry +
# the job/status persistence schema it owns). Both cookbooks — blut-lamu
# (generic LLM) and blut-lamquant (EEG codec, for its `hf_sft` recipe) —
# depend on this crate. See [[project_blut_cookbook_split]].
[workspace]
members = [".", "crates/blut-cookbook-core"]
resolver = "2"

[package]
name = "blut-cookbook-standard"
version = "0.2.0-alpha.1"
edition = "2024"
authors = ["Brian Lam"]
license = "AGPL-3.0-or-later"
description = "Standard ML cookbook and trainer backends for BLUT."
rust-version = "1.88"
repository = "https://github.com/Quitetall/blut-backends"
homepage = "https://github.com/Quitetall/blut-backends"
documentation = "https://docs.rs/blut-cookbook-standard"
readme = "README.md"
keywords = ["machine-learning", "training", "workflow", "llm"]
categories = ["science", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/python/blut_core/*.py",
    "/python/blut_core/ingredients/**/*.py",
    "/python/blut_standard/*.py",
    "/python/datasets_loader.py",
    "/python/trainer.py",
    "/python/trainer_dpo.py",
    "/python/trainer_distill.py",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
]

[lib]
name = "blut_backends"
path = "src/lib.rs"

[[bin]]
name = "blut-standard"
path = "src/main.rs"

[dependencies]
# Exact preview pin: standard/core and engine move as one reviewed release train.
blut = "=0.2.0-alpha.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
parking_lot = "0.12"
nix = { version = "0.29", features = ["signal", "process"] }
dirs = "5"
sha2 = "0.10"
which = "6"
rand = "0.8"
# conversations.rs reads the lamu conversation DB; atomic JSONL writes
# + several backend runners stage to a temp dir.
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process"] }
