# Dependency policy for blut-cookbooks, enforced by the `deny` job in
# .github/workflows/ci.yml. Modeled on the engine's own deny.toml.

[graph]
all-features = true

[advisories]
# Every entry needs a reason, and an unmaintained-only advisory is the only
# kind that may be ignored. A vulnerability is fixed, not waived, with one
# recorded exception: RUSTSEC-2026-0459 below, a time-boxed waiver the owner
# approved on 2026-11-13 because the fix needs a new engine release.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3 is unmaintained but has no known vulnerability; it arrives through the blut engine, whose own deny.toml carries the same waiver until the engine migrates its cache and P2P wire codec" },
    { id = "RUSTSEC-2024-0449", reason = "unmaintained-only unsafe-libyaml is transitive through the blut engine's serde_yaml 0.9, which parses local operator-written config, never network input; no known vulnerability; the engine's own deny.toml carries the same waiver until it moves to a safe-Rust parser" },
    { id = "RUSTSEC-2026-0459", reason = "VULNERABILITY, temporary owner-approved waiver (2026-11-13): libsqlite3-sys bundles a C SQLite with CVE-2026-119375; the patched libsqlite3-sys 0.39+ needs rusqlite 0.41, but the pinned blut engine (=0.2.0-alpha.1, and its main) uses rusqlite 0.32 and both link the native library, so this workspace cannot move alone; the cookbooks reach SQLite only through the engine's local registries; REMOVE this entry when the engine upgrades rusqlite; re-check by 2026-12-13" },
]

[licenses]
confidence-threshold = 0.8
# AGPL-3.0-or-later is the engine's license, and this workspace's
# blut-cookbook-core crate. NOTICE explains the split.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The two crates in this workspace reference each other by path.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
