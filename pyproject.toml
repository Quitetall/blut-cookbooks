[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blut-cookbook-standard"
version = "0.2.0a1"
description = "Python runtime for BLUT standard and core cookbooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "Brian Lam" }]
keywords = ["machine-learning", "training", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
[project.urls]
Homepage = "https://github.com/Quitetall/blut-backends"
Repository = "https://github.com/Quitetall/blut-backends"
Issues = "https://github.com/Quitetall/blut-backends/issues"

[project.optional-dependencies]
training = [
    "datasets>=2.20,<4",
    "safetensors>=0.4,<1",
    "torch>=2.5,<3",
    "transformers>=4.45,<5",
]
test = ["numpy>=1.26,<3", "pytest>=8,<9"]
build = ["build>=1,<2", "twine>=5,<7"]

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["blut_core", "blut_core.*", "blut_standard"]
exclude = ["blut_core.tests", "blut_core.tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["python"]
addopts = "--strict-config --strict-markers"
